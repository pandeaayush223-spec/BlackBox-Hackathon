<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  {/* Sun Body */}
  <circle cx="50" cy="45" r="22" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" />
  
  {/* Rays */}
  <line x1="50" y1="12" x2="50" y2="18" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="74" y1="21" x2="69" y2="26" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="88" y1="45" x2="82" y2="45" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="26" y1="21" x2="31" y2="26" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="12" y1="45" x2="18" y2="45" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  {/* Horizontal Water Lines */}
  <line x1="20" y1="65" x2="40" y2="65" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="65" x2="80" y2="65" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" />

  {/* Wave Path */}
  <path d="M35 65 C 45 65, 45 45, 55 45 C 65 45, 65 65, 75 65" 
        stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
